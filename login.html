<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>تسجيل الدخول | سايبرز</title>
<style>
:root{--bg:#050514;--card:#0e0e2e;--text:#ececf4;--muted:#9a9ac4;--line:#25256a;--a:#7b7bf0}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1a1a5a55,transparent),var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.c{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 20px 60px #0008;text-align:center}
.c img{width:68px;height:68px;border-radius:16px;object-fit:cover}.c h1{margin:12px 0 4px;font-size:22px}.c p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.st{display:flex;flex-direction:column;gap:10px;margin:22px 0 20px;text-align:start}.st div{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text);line-height:1.6}.st b{flex:none;width:24px;height:24px;border-radius:50%;background:#7b7bf033;color:var(--a);display:flex;align-items:center;justify-content:center;font-size:13px}
.go{display:block;width:100%;padding:13px;border-radius:10px;background:var(--a);color:#fff;font-size:16px;font-weight:600;text-decoration:none}
.go:hover{filter:brightness(1.08)}.bk{display:block;margin-top:16px;color:var(--muted);font-size:13px;text-decoration:none}.bk:hover{color:var(--text)}
</style></head><body>
<main class="c">
<img src="/logo.jpg" alt=""><h1>لوحة تحكم سايبرز</h1><p>الدخول مخصص للمشرفين المصرّح لهم، ويتم عبر حماية Cloudflare.</p>
