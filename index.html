<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBERS_SA | دليل فعاليات الأمن السيبراني في السعودية</title>
<meta name="description" content="دليل فعاليات ومعسكرات وورش الأمن السيبراني المجانية في السعودية | Free cyber security events, bootcamps and workshops in Saudi Arabia">
<link rel="canonical" href="https://cybers-sa.com/">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<link rel="apple-touch-icon" href="/logo.jpg">
<meta name="theme-color" content="#050514">

<meta property="og:type" content="website">
<meta property="og:url" content="https://cybers-sa.com/">
<meta property="og:title" content="CYBERS_SA | دليل فعاليات الأمن السيبراني في السعودية">
<meta property="og:description" content="كل الفعاليات والمعسكرات والورش المجانية في مكان واحد">
<meta property="og:image" content="https://cybers-sa.com/banner.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cybers-sa.com/banner.jpg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f4fa;--card:#fff;--text:#0b0b2a;--muted:#55557a;--line:#d9d9ee;--accent:#2a2aa8;--accent2:#5b5be0;--hero:linear-gradient(135deg,#e8e8f8,#d4d4f5)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050514;--card:#0e0e2e;--text:#ececf4;--muted:#9a9ac4;--line:#25256a;--accent:#7b7bf0;--accent2:#a3a3ff;--hero:linear-gradient(135deg,#050514,#1c1c78)}}
:root[data-theme="dark"]{--bg:#050514;--card:#0e0e2e;--text:#ececf4;--muted:#9a9ac4;--line:#25256a;--accent:#7b7bf0;--accent2:#a3a3ff;--hero:linear-gradient(135deg,#050514,#1c1c78)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,Segoe UI,Arial,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
.brand svg{width:34px;height:34px}
.links{display:flex;gap:18px;color:var(--muted);font-size:15px}
.links a:hover{color:var(--accent2)}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{background:var(--hero);border-bottom:1px solid var(--line);padding:64px 0 52px;text-align:center}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 12px;line-height:1.3}
.hero p{color:var(--muted);max-width:620px;margin:0 auto 26px;font-size:18px}
.search{max-width:560px;margin:auto;display:flex;gap:8px}
.search input{flex:1;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.stats{display:flex;justify-content:center;gap:34px;margin-top:30px;flex-wrap:wrap}
.stats b{display:block;font-size:26px;color:var(--accent2)}
.stats span{color:var(--muted);font-size:14px}
section{padding:46px 0}
h2{font-size:26px;margin:0 0 18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:7px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.tag{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent2)}
.card h3{margin:0;font-size:18px}
.meta{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.meta span{display:flex;gap:6px;align-items:center}
.free{color:#35c48a;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h3{margin:6px 0}
.box p{margin:0;color:var(--muted);font-size:15px}
.ico{width:30px;height:30px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.road li{margin:8px 0;color:var(--muted)}
.cta{background:var(--hero);border:1px solid var(--line);border-radius:20px;padding:34px;text-align:center}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.soc{display:flex;gap:12px}
.soc a{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center}
.soc a:hover{border-color:var(--accent)}
.soc svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:1.8}
.note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:700px){.links{display:none}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="#top">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent2)"><circle cx="24" cy="24" r="19"/><path d="M24 11l-9 3v8c0 7 4 11 9 13 5-2 9-6 9-13v-8z"/><rect x="19" y="21" width="10" height="8" rx="1.5"/><path d="M21 21v-3a3 3 0 016 0v3"/></svg>
    <span>CYBERS_SA</span></a>
  <nav class="links"><a href="#events" data-i="n1"></a><a href="#about" data-i="n2"></a><a href="#roadmap" data-i="n3"></a><a href="#submit" data-i="n4"></a></nav>
  <div class="tools"><button class="btn" id="lang">EN</button><button class="btn" id="theme" aria-label="theme">◐</button></div>
</div></header>

<div class="hero" id="top"><div class="wrap">
  <h1 data-i="h1"></h1><p data-i="h2"></p>
  <div class="search"><input id="q" data-ph="ph"><a class="btn p" href="#events" data-i="browse"></a></div>
  <div class="stats"><div><b id="s1">0</b><span data-i="st1"></span></div><div><b>100%</b><span data-i="st2"></span></div><div><b>13</b><span data-i="st3"></span></div></div>
</div></div>

<section id="events"><div class="wrap">
  <h2 data-i="n1"></h2>
  <div class="filters" id="types"></div>
  <div class="filters"><select id="city"></select><select id="mode"></select></div>
  <div class="grid" id="list"></div>
  <p class="note" data-i="demo"></p>
</div></section>

<section id="about"><div class="wrap">
  <h2 data-i="n2"></h2>
  <div class="cols">
    <div class="box"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><h3 data-i="a1t"></h3><p data-i="a1"></p></div>
    <div class="box"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M9 12l2 2 4-4"/></svg><h3 data-i="a2t"></h3><p data-i="a2"></p></div>
    <div class="box"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><h3 data-i="a3t"></h3><p data-i="a3"></p></div>
  </div>
</div></section>

<section id="roadmap"><div class="wrap">
  <h2 data-i="n3"></h2>
  <div class="box"><ul class="road" id="road"></ul></div>
</div></section>

<section id="submit"><div class="wrap"><div class="cta">
  <h2 data-i="c1"></h2><p style="color:var(--muted)" data-i="c2"></p>
  <a class="btn p" href="mailto:contact@example.com" data-i="c3"></a>
</div></div></section>

<footer><div class="wrap foot">
  <div id="rights"></div>
  <div class="soc">
    <a href="#" aria-label="X"><svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg></a>
    <a href="#" aria-label="Mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></a>
    <a href="#" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M21 4L3 11l6 2 2 6 3-4 5 3z"/></svg></a>
    <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 014 0v4M12 10v7"/></svg></a>
  </div>
</div></footer>

<script>
const T={
ar:{n1:"الفعاليات",n2:"عن المنصة",n3:"خطتنا القادمة",n4:"أضف فعالية",h1:"كل فعاليات الأمن السيبراني المجانية في السعودية… في مكان واحد",h2:"معسكرات، ورش، برامج وفعاليات مجانية، نجمعها لك ونحدثها باستمرار.",ph:"ابحث عن فعالية أو معسكر…",browse:"تصفح",st1:"فعالية",st2:"مجاني",st3:"منطقة",all:"الكل",ev:"فعالية",bc:"معسكر",ws:"ورشة",pg:"برنامج",cityAll:"كل المدن",modeAll:"حضوري / عن بُعد",onsite:"حضوري",online:"عن بُعد",free:"مجاني",none:"لا توجد نتائج مطابقة.",demo:"* البيانات الحالية تجريبية لعرض التصميم، وتُستبدل ببيانات حقيقية.",a1t:"اكتشف",a1:"دليل واحد يجمع الفعاليات بدل التنقل بين الحسابات والمنصات.",a2t:"موثوق",a2:"نراجع كل فعالية قبل نشرها ونوضح الجهة المنظمة ورابط التسجيل.",a3t:"للجميع",a3:"موقع بالعربية والإنجليزية، مناسب للطلاب والمبتدئين والمحترفين.",c1:"عندك فعالية أو معسكر؟",c2:"أرسل التفاصيل وننشرها مجانًا لتصل للمجتمع التقني.",c3:"أرسل فعاليتك",road:["الآن: دليل الفعاليات مع البحث والتصنيف والمدن","قريبًا: تقويم وتنبيهات بالبريد وتيليجرام قبل الفعالية","ثم: نموذج تقديم فعاليات من المنظمين مع مراجعة","لاحقًا: حسابات ومفضلة وخريطة الفعاليات","مستقبلًا: دليل مصادر تعلم، وتحديات CTF، ومجتمع نقاش"],rights:"© 2026 CYBERS_SA. جميع الحقوق محفوظة."},
en:{n1:"Events",n2:"About",n3:"Roadmap",n4:"Submit",h1:"Every free cyber security event in Saudi Arabia, in one place",h2:"Bootcamps, workshops, programs and events: collected and constantly updated.",ph:"Search events or bootcamps…",browse:"Browse",st1:"Events",st2:"Free",st3:"Regions",all:"All",ev:"Event",bc:"Bootcamp",ws:"Workshop",pg:"Program",cityAll:"All cities",modeAll:"Onsite / Online",onsite:"Onsite",online:"Online",free:"Free",none:"No matching results.",demo:"* Current data is placeholder to showcase the design.",a1t:"Discover",a1:"One directory instead of hopping between accounts and platforms.",a2t:"Trusted",a2:"Every listing is reviewed, with organizer and registration link shown.",a3t:"For everyone",a3:"Arabic and English, built for students, beginners and professionals.",c1:"Running an event or bootcamp?",c2:"Send the details and we'll list it for free to reach the community.",c3:"Submit your event",road:["Now: events directory with search, filters and cities","Soon: calendar plus email/Telegram reminders","Then: organizer submission form with review","Later: accounts, favorites and an events map","Future: learning resources, CTF challenges, community"],rights:"© 2026 CYBERS_SA. All rights reserved."}};
const CITY={ar:{r:"الرياض",j:"جدة",d:"الدمام",k:"الخبر",m:"المدينة",o:"عن بُعد"},en:{r:"Riyadh",j:"Jeddah",d:"Dammam",k:"Khobar",m:"Madinah",o:"Remote"}};
const D=[
{t:"ev",ar:"مؤتمر أمن سيبراني (تجريبي)",en:"Cyber Security Conference (sample)",c:"r",m:"onsite",d:"2026-11-10",o:"Org A"},
{t:"bc",ar:"معسكر مبتدئين في الأمن (تجريبي)",en:"Security Beginners Bootcamp (sample)",c:"j",m:"onsite",d:"2026-11-18",o:"Org B"},
{t:"ws",ar:"ورشة اختبار اختراق الويب (تجريبي)",en:"Web Pentesting Workshop (sample)",c:"o",m:"online",d:"2026-11-22",o:"Org C"},
{t:"pg",ar:"برنامج تدريب تعاوني (تجريبي)",en:"Cooperative Training Program (sample)",c:"d",m:"onsite",d:"2026-12-01",o:"Org D"},
{t:"ws",ar:"ورشة تحليل البرمجيات الخبيثة (تجريبي)",en:"Malware Analysis Workshop (sample)",c:"k",m:"onsite",d:"2026-12-05",o:"Org E"},
{t:"ev",ar:"مسابقة CTF (تجريبي)",en:"CTF Competition (sample)",c:"o",m:"online",d:"2026-12-12",o:"Org F"}];
let lang="ar",type="all";
const $=s=>document.querySelector(s);
function render(){
 const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
 $("#q").placeholder=t.ph;$("#lang").textContent=lang=="ar"?"EN":"عربي";
 $("#rights").textContent=t.rights;$("#s1").textContent=D.length;
 $("#road").innerHTML=t.road.map(x=>"<li>"+x+"</li>").join("");
 $("#types").innerHTML=["all","ev","bc","ws","pg"].map(k=>`<button class="chip ${type==k?"on":""}" onclick="type='${k}';render()">${t[k]}</button>`).join("");
 const cs=$("#city").value||"",ms=$("#mode").value||"";
 $("#city").innerHTML=`<option value="">${t.cityAll}</option>`+Object.keys(CITY[lang]).map(k=>`<option value="${k}" ${cs==k?"selected":""}>${CITY[lang][k]}</option>`).join("");
 $("#mode").innerHTML=`<option value="">${t.modeAll}</option><option value="onsite" ${ms=="onsite"?"selected":""}>${t.onsite}</option><option value="online" ${ms=="online"?"selected":""}>${t.online}</option>`;
 list();
}
function list(){
 const t=T[lang],q=$("#q").value.toLowerCase(),c=$("#city").value,m=$("#mode").value;
 const r=D.filter(e=>(type=="all"||e.t==type)&&(!c||e.c==c)&&(!m||e.m==m)&&e[lang].toLowerCase().includes(q));
 $("#list").innerHTML=r.length?r.map(e=>`<div class="card"><span class="tag">${t[e.t]}</span><h3>${e[lang]}</h3><div class="meta"><span>📅 ${e.d}</span><span>📍 ${CITY[lang][e.c]} · ${t[e.m]}</span><span>🏢 ${e.o}</span></div><span class="free">${t.free}</span></div>`).join(""):`<div class="empty">${t.none}</div>`;
}
$("#lang").onclick=()=>{lang=lang=="ar"?"en":"ar";render()};
$("#q").oninput=list;$("#city").onchange=list;$("#mode").onchange=list;
$("#theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()=="#050514";r.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
