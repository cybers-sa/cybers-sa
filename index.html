.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.tag{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent2)}

.free{color:#35c48a;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px}

.box h3{margin:6px 0}
.box p{margin:0;color:var(--muted);font-size:15px}
.ico{width:30px;height:30px;stroke:var(--accent2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.road li{margin:8px 0;color:var(--muted)}

 const t=T[lang],q=$("#q").value.toLowerCase(),c=$("#city").value,m=$("#mode").value,past=$("#past").checked;
 const r=D.map(e=>({...e,s:st(e)})).filter(e=>(past||e.s!="ended")&&(type=="all"||e.type==type)&&(!c||e.city==c)&&(!m||e.mode==m)&&(e.title[lang]||"").toLowerCase().includes(q)).sort((a,b)=>a.start.localeCompare(b.start));
 $("#list").innerHTML=r.length?r.map(e=>`<div class="card ${e.s=="ended"?"dim":""}"><div class="row"><span class="tag">${t[e.type]}</span><span class="st ${e.s}">${t["s_"+e.s]}</span></div><h3>${esc(e.title[lang])}</h3><div class="meta"><span>📅 ${e.start}${e.end&&e.end!=e.start?" → "+e.end:""}</span><span>📍 ${CITY[lang][e.city]} · ${t[e.mode]}</span>${e.org?`<span>🏢 ${esc(e.org)}</span>`:""}${e.deadline?`<span>⏳ ${t.dl}: ${e.deadline}</span>`:""}</div><span class="free">${t.free}</span>${e.s=="open"||e.s=="soon"?`<a class="btn p" href="${esc(e.link||"#")}" target="_blank" rel="noopener">${t.reg}</a>`:`<span class="btn" style="opacity:.5">${t["s_"+e.s]}</span>`}</div>`).join(""):`<div class="empty">${t.none}</div>`;
 $("#s1").textContent=D.filter(e=>st(e)!="ended").length;
}
$("#lang").onclick=()=>{lang=lang=="ar"?"en":"ar";render()};
let T0=0;
function formOpts(){const t=T[lang],o=(a,f)=>a.map(k=>`<option value="${k}">${f(k)}</option>`).join("");
 $("#f_type").innerHTML=o(["ev","bc","ws","pg"],k=>t[k]);$("#f_city").innerHTML=o(Object.keys(CITY[lang]),k=>CITY[lang][k]);$("#f_mode").innerHTML=o(["onsite","online"],k=>t[k])}
$("#openForm").onclick=()=>{formOpts();$("#sf").reset();$("#fmsg").textContent="";T0=Date.now();$("#dlg").showModal()};
$("#fcancel").onclick=()=>$("#dlg").close();
$("#sf").onsubmit=async e=>{e.preventDefault();const t=T[lang],b={t:T0};
 ["type","title_ar","title_en","city","mode","start_date","end_date","deadline","org","link","contact","notes","website"].forEach(k=>b[k]=$("#f_"+k).value);
 $("#fsend").disabled=true;
 try{const r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
  $("#fmsg").textContent=r.ok?t.sent:(r.status==429?t.limit:t.err);if(r.ok){$("#sf").reset();setTimeout(()=>$("#dlg").close(),2500)}}
 catch{$("#fmsg").textContent=t.err}
 $("#fsend").disabled=false};
$("#types").onclick=e=>{const b=e.target.closest("button");if(b){type=b.dataset.k;render()}};$("#q").oninput=list;$("#past").onchange=list;$("#city").onchange=list;$("#mode").onchange=list;
$("#theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()=="#050514";r.dataset.theme=dark?"light":"dark"};
fetch("/api/events").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;render()}).catch(()=>render());
</script>
</body>
