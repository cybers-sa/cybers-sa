<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>لوحة التحكم | CYBERS_SA</title>
<style>
:root{--bg:#050514;--card:#0e0e2e;--text:#ececf4;--muted:#9a9ac4;--line:#25256a;--a:#7b7bf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:1000px;margin:auto;padding:16px}
h1{font-size:22px;display:flex;justify-content:space-between;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{font-size:13px;color:var(--muted);display:block}
input,select,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
button,.b{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none}
.p{background:var(--a);border-color:var(--a);color:#fff}.d{color:#ff7b7b}
.r{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}
.s{font-size:12px;padding:2px 9px;border-radius:99px;background:#8884}.s.o{background:#35c48a33;color:#35c48a}
.x{overflow-x:auto}#m{color:#ff7b7b}.tb button.on{background:var(--a);border-color:var(--a);color:#fff}.st{font-size:12px;padding:2px 9px;border-radius:99px;background:#8884}.st.good{background:#35c48a33;color:#35c48a}.st.maybe{background:#f5a52433;color:#f5a524}.st.no{background:#ff7b7b33;color:#ff7b7b}.ap{border-top:1px solid var(--line);padding:12px 0}.ap small,.mut{color:var(--muted)}.ap a{color:var(--a)}.ap a.p{color:#fff}.sel button.on{border-color:var(--a)}.dot{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid transparent;display:inline-block;vertical-align:middle}.dot.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}i.dot{width:12px;height:12px;border:0}.cnt{display:inline-flex;gap:6px;align-items:center;font-size:15px;padding:6px 14px}.cnt.on{border-color:var(--a);background:#7b7bf022}.ap{border-inline-start:4px solid transparent;padding-inline-start:12px}.ap.new{border-inline-start-color:#7b8bd0}.ap.good{border-inline-start-color:#35c48a}.ap.maybe{border-inline-start-color:#f5a524}.ap.no{border-inline-start-color:#ff7b7b;opacity:.75}
</style></head><body><div class="w">
<h1>لوحة التحكم <a class="b" href="/">الموقع ↗</a></h1>
<div class="r tb" id="tabs" style="margin:0 0 14px"><button data-v="ev" class="on">الفعاليات</button><button data-v="sb">طلبات الفعاليات <span id="nsb"></span></button><button data-v="jb">الوظائف</button><button data-v="ap">المتقدمون <span id="nnew"></span></button><button data-v="bk">بنك السير</button></div>
<div id="v_ev">
<div class="box"><b id="ft">إضافة فعالية</b>
<div class="g" style="margin-top:10px">
<div><label>النوع</label><select id="type"><option value="ev">فعالية</option><option value="bc">معسكر</option><option value="cr">دورة</option><option value="ws">ورشة</option><option value="pg">برنامج</option></select></div>
<div><label>العنوان (عربي) *</label><input id="title_ar"></div>
<div><label>العنوان (English): يظهر في الصفحة الإنجليزية، وإذا تركته فاضيًا يظهر العربي</label><input id="title_en"></div>
<div><label>طريقة التقديم</label><select id="delivery"><option value="live">مباشر (له موعد بدء)</option><option value="self">ذاتية (بدون موعد بدء، ولها تاريخ نهاية)</option><option value="cont">ذاتية | مستمرة (بدون تواريخ)</option></select></div>
<div><label>المدينة</label><select id="city"><option value="r">الرياض</option><option value="j">جدة</option><option value="d">الدمام</option><option value="k">الخبر</option><option value="m">المدينة</option><option value="o">عن بُعد</option><option value="x">أخرى (اكتبها في خانة الموقع)</option></select></div>
<div><label>الموقع (اختياري): الحي أو القاعة، أو المدينة إذا اخترت «أخرى»</label><input id="place" maxlength="150"></div>
<div><label>الحضور</label><select id="mode"><option value="onsite">حضوري</option><option value="online">عن بُعد</option></select></div>
<div id="w_start"><label>تاريخ البداية (اختياري إذا حددت آخر موعد للتقديم)</label><input type="date" id="start_date"></div>
<div id="w_end"><label>تاريخ النهاية (تختفي الفعالية تلقائيًا بعده)</label><input type="date" id="end_date"></div>
<div id="w_dl"><label>آخر موعد للتقديم (يقفل التقديم تلقائيًا بعده)</label><input type="date" id="deadline"></div>
<div style="grid-column:1/-1"><label>الوصف (عربي): يظهر في "المزيد من المعلومات"</label><textarea id="desc_ar" rows="3" maxlength="1500"></textarea></div>
<div style="grid-column:1/-1"><label>Description (English) اختياري</label><textarea id="desc_en" rows="3" maxlength="1500" dir="ltr"></textarea></div>
<div><label>الجهة المنظمة: للّغتين اكتب «عربي | English» مثل: طويق | Tuwaiq</label><input id="org" list="orgs" autocomplete="off"><datalist id="orgs"></datalist></div>
<div style="grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><img id="org_prev" alt="" style="width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;display:none"><div><label>شعار الجهة (اختياري): يُحفظ باسم الجهة ويُستخدم تلقائيًا في كل فعالياتها</label><input type="file" id="org_logo_file" accept="image/png,image/jpeg,image/webp"><small id="org_hint" style="color:var(--muted)"></small></div></div>
<div><label>رابط التسجيل (https://...)</label><input id="link" dir="ltr"></div>
</div>
<div class="r"><label><input type="checkbox" id="closed" style="width:auto"> التسجيل مغلق</label><label><input type="checkbox" id="published" style="width:auto" checked> منشورة</label><label><input type="checkbox" id="show_ended" style="width:auto"> تبقى معروضة بعد انتهائها (بوسم «انتهت»)</label></div>
<div class="r"><button class="p" id="save">حفظ</button><button id="cancel">إلغاء</button><span id="m"></span></div></div>
<div class="box x"><table><thead><tr><th>العنوان</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead><tbody id="t"></tbody></table></div>
</div>
<div id="v_sb" style="display:none"><div class="box"><b>طلبات الفعاليات من الزوار (<span id="sc">0</span>)</b><div id="sl"></div></div></div>
<div id="v_jb" style="display:none">
<div class="box"><b id="jft">إضافة وظيفة</b>
<div class="g" style="margin-top:10px">
<div><label>المسمى الوظيفي (عربي) *</label><input id="j_title_ar"></div>
<div><label>Job title (English) اختياري</label><input id="j_title_en" dir="ltr"></div>
<div><label>الجهة: «عربي | English» (يظهر شعارها إن كان محفوظًا)</label><input id="j_org" list="orgs" autocomplete="off"></div>
<div><label>نوع الوظيفة</label><select id="j_kind"><option value="full">دوام كامل</option><option value="part">دوام جزئي</option><option value="intern">تدريب</option><option value="contract">عقد</option></select></div>
<div><label>المدينة</label><select id="j_city"><option value="r">الرياض</option><option value="j">جدة</option><option value="d">الدمام</option><option value="k">الخبر</option><option value="m">المدينة</option><option value="o">عن بُعد</option><option value="x">أخرى (اكتبها في خانة الموقع)</option></select></div>
<div><label>الموقع (اختياري): الحي أو المقر، أو المدينة إذا اخترت «أخرى»</label><input id="j_place" maxlength="150"></div>
<div><label>الحضور</label><select id="j_mode"><option value="onsite">حضوري</option><option value="online">عن بُعد</option></select></div>
<div><label>سنوات الخبرة المطلوبة (مثل 3-5)</label><input id="j_exp" dir="ltr" maxlength="20"></div>
<div><label>آخر موعد للتقديم (تختفي الوظيفة بعده)</label><input type="date" id="j_deadline"></div>
<div style="grid-column:1/-1"><label>وصف الوظيفة (عربي)</label><textarea id="j_desc_ar" rows="4" maxlength="3000"></textarea></div>
<div style="grid-column:1/-1"><label>Description (English) اختياري</label><textarea id="j_desc_en" rows="3" maxlength="3000" dir="ltr"></textarea></div>
<div style="grid-column:1/-1"><label>أسئلة نعم/لا للمتقدم: سؤال في كل سطر (حتى 10). للّغتين: «عربي | English»</label><textarea id="j_q" rows="4" placeholder="هل لديك شهادة Security+؟&#10;هل لديك خبرة في SIEM؟"></textarea></div>
</div>
<div class="r"><label><input type="checkbox" id="j_closed" style="width:auto"> التقديم مغلق</label><label><input type="checkbox" id="j_published" style="width:auto" checked> منشورة</label></div>
<div class="r"><button class="p" id="jsave">حفظ</button><button id="jcancel">إلغاء</button><span id="jm" style="color:#ff7b7b"></span></div></div>
<div class="box x"><table><thead><tr><th>الوظيفة</th><th>الطلبات</th><th>الحالة</th><th></th></tr></thead><tbody id="jt"></tbody></table></div>
</div>
<div id="v_ap" style="display:none"><div class="box">
<div class="r" id="ap_cnt" style="margin:0 0 12px"></div>
<div class="g">
<div><label>الوظيفة</label><select id="ap_job"></select></div>
<div><label>بحث (اسم، بريد، جوال)</label><input id="ap_q"></div>
<div><label>الخبرة من (سنة)</label><input id="ap_y1" type="number" min="0"></div>
<div><label>إلى (سنة)</label><input id="ap_y2" type="number" min="0"></div>
<div><label>الترتيب</label><select id="ap_sort"><option value="new">الأحدث</option><option value="exp">الأكثر خبرة</option></select></div>
</div>
<div class="g" id="ap_qs" style="margin-top:10px"></div>
<div class="r"><button class="p" id="zip_ap">⬇ تحميل المرشّحين (ZIP)</button><button class="d" id="del_ap">🗑 حذف المعروض</button><span class="mut" id="ap_shown"></span><span class="mut" id="zip_m"></span></div>
<div id="apl"></div></div></div>
<div id="v_bk" style="display:none"><div class="box"><div class="mut" style="margin-bottom:8px">كل السير الذاتية المحفوظة مصنفة حسب الوظيفة، وتبقى هنا حتى لو حُذفت الوظيفة.</div><div class="g"><div><label>بحث بالاسم أو البريد</label><input id="bk_q"></div><div><label>التصنيف</label><select id="bk_st"><option value="">الكل</option><option value="new">جديد</option><option value="good">مرشّح</option><option value="maybe">احتياطي</option><option value="no">مرفوض</option></select></div><div><label>أقل عدد سنوات خبرة</label><input id="bk_y" type="number" min="0" value="0"></div></div><div class="r"><button class="p" id="zip_bk">⬇ تحميل المعروض (ZIP)</button><button class="d" id="del_bk">🗑 حذف المعروض</button><span class="mut" id="zip_m2"></span></div><div id="bkl" class="x"></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s);let rows=[],eid=null;
const F=['type','title_ar','title_en','desc_ar','desc_en','city','place','mode','delivery','start_date','end_date','deadline','org','link'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw 0;return r.json()}
const J=(m,b)=>({method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const datesMsg=(a,b,c)=>{const bad=x=>x&&(+x.slice(0,4)<2020||+x.slice(0,4)>2100);return bad(a)||bad(b)||bad(c)?'السنة في التاريخ غير صحيحة (تحقق من الرقم)':(a&&b&&b<a?'تاريخ النهاية قبل تاريخ البداية':'')};
const msg=t=>{$('#m').textContent=t;setTimeout(()=>$('#m').textContent='',3500)};
function status(e){const t=new Date().toISOString().slice(0,10);const last=e.end_date||e.start_date||e.deadline;if(last&&last<t)return['منتهية',0];if(e.closed||(e.deadline&&e.deadline<t))return['مغلق',0];return['مفتوح',1]}
function draw(){$('#t').innerHTML=rows.map(e=>{const [s,o]=status(e);const wr=datesMsg(e.start_date,e.end_date,e.deadline);return`<tr><td>${esc(e.title_ar)}${e.published?'':' <small>(مخفية)</small>'}${wr?' <small style="color:#f5a524">⚠ '+wr+'</small>':''}</td><td>${e.delivery=='cont'?'ذاتية مستمرة':e.delivery=='self'?'ذاتية':esc(e.start_date)}</td><td><span class="s ${o?'o':''}">${s}</span></td><td><button data-a="e" data-i="${e.id}">تعديل</button> <button data-a="c" data-i="${e.id}">${e.closed?'فتح التسجيل':'قفل التسجيل'}</button> <button data-a="p" data-i="${e.id}">${e.published?'إخفاء':'نشر'}</button> <button data-a="k" data-i="${e.id}">${Number(e.show_ended)?'إخفاء بعد الانتهاء':'إبقاء بعد الانتهاء'}</button> <button data-a="l" data-i="${e.id}">نسخ الرابط</button> <button class="d" data-a="x" data-i="${e.id}">حذف</button></td></tr>`}).join('')||'<tr><td colspan=4>لا توجد فعاليات بعد.</td></tr>'}
async function load(){try{rows=await api('/api/admin/events');draw()}catch{msg('تعذر التحميل، تأكد من إعداد الحماية وقاعدة البيانات')}}
function fill(e){F.forEach(k=>$('#'+k).value=e?e[k]||'':(k=='type'?'ev':k=='city'?'r':k=='mode'?'onsite':k=='delivery'?'live':''));$('#closed').checked=!!(e&&e.closed);$('#published').checked=e?!!e.published:true;$('#show_ended').checked=!!(e&&Number(e.show_ended));eid=e?e.id:null;$('#ft').textContent=e?'تعديل فعالية':'إضافة فعالية';$('#org_logo_file').value='';orgInfo();togDel()}
$('#save').onclick=async()=>{const b={};F.forEach(k=>b[k]=$('#'+k).value);b.closed=$('#closed').checked;b.published=$('#published').checked;b.show_ended=$('#show_ended').checked;
 if(!b.title_ar||(b.delivery=='live'&&!b.start_date&&!b.deadline)||(b.delivery=='self'&&!b.end_date))return msg('العنوان مطلوب. للمباشر: تاريخ البداية أو آخر موعد للتقديم على الأقل. للذاتية: تاريخ النهاية');
 const lf=$('#org_logo_file').files[0];if(lf){try{b.org_logo=await toDataUrl(lf)}catch{return msg('تعذر قراءة صورة الشعار')}}
 {const dm=datesMsg(b.start_date,b.end_date,b.deadline);if(dm)return msg(dm)}
 try{await api(eid?'/api/admin/events/'+eid:'/api/admin/events',J(eid?'PUT':'POST',b));fill(null);msg('تم الحفظ ✓');load();loadOrgs()}catch{msg('فشل الحفظ')}};
$('#cancel').onclick=()=>fill(null);
$('#t').onclick=async ev=>{const bt=ev.target.closest('button');if(!bt)return;const e=rows.find(r=>r.id==bt.dataset.i),a=bt.dataset.a;
 try{if(a=='e'){fill(e);scrollTo(0,0)}
 else if(a=='c'){await api('/api/admin/events/'+e.id,J('PUT',{...e,closed:!e.closed}));load()}
 else if(a=='p'){await api('/api/admin/events/'+e.id,J('PUT',{...e,published:!e.published}));load()}
 else if(a=='l'){const u=location.origin+'/e/'+e.id;try{await navigator.clipboard.writeText(u);msg('تم نسخ الرابط ✓')}catch{prompt('انسخ الرابط',u)}}
 else if(a=='k'){await api('/api/admin/events/'+e.id,J('PUT',{...e,show_ended:!Number(e.show_ended)}));load()}
 else if(a=='x'&&confirm('حذف هذه الفعالية نهائيًا؟')){await api('/api/admin/events/'+e.id,{method:'DELETE'});load()}}catch{msg('فشلت العملية')}};
const C={r:'الرياض',j:'جدة',d:'الدمام',k:'الخبر',m:'المدينة',o:'عن بُعد'},Tp={ev:'فعالية',bc:'معسكر',cr:'دورة',ws:'ورشة',pg:'برنامج'};let subs=[];
async function loadSubs(){try{subs=await api('/api/admin/submissions');drawSubs()}catch{}}
function drawSubs(){$('#sc').textContent=subs.length;$('#nsb').textContent=subs.length?'('+subs.length+')':'';
 $('#sl').innerHTML=!subs.length?'<div class="mut" style="margin-top:8px">لا توجد طلبات جديدة.</div>':subs.map(s=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>${esc(s.title_ar)}</b>${s.title_en?' · '+esc(s.title_en):''}<div style="color:var(--muted);font-size:13px">${esc(Tp[s.type]||'')} · ${esc(C[s.city]||'')} · ${s.delivery=='cont'?'ذاتية مستمرة':s.delivery=='self'?'ذاتية':esc(s.start_date)}${s.deadline?' · آخر موعد '+esc(s.deadline):''} · ${esc(s.org)}<br>الرابط: <a href="${esc(s.link)}" target="_blank" rel="noopener" style="color:var(--a)">${esc(s.link)}</a><br>التواصل: ${esc(s.contact)}${s.notes?'<br>ملاحظات: '+esc(s.notes):''}</div><div class="r"><button class="p" data-s="a" data-i="${s.id}">قبول ونشر</button><button class="d" data-s="r" data-i="${s.id}">رفض</button></div></div>`).join('')}
$('#sl').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;try{if(b.dataset.s=='a')await api('/api/admin/submissions/'+b.dataset.i+'/approve',{method:'POST'});else if(confirm('رفض هذا الطلب؟'))await api('/api/admin/submissions/'+b.dataset.i,{method:'DELETE'});loadSubs();load()}catch{msg('فشلت العملية')}};
function togDel(){const v=$('#delivery').value,live=v=='live',cont=v=='cont';
 $('#w_start').style.display=live?'':'none';if(!live)$('#start_date').value='';
 $('#w_end').style.display=cont?'none':'';$('#w_dl').style.display=cont?'none':'';if(cont){$('#end_date').value='';$('#deadline').value=''}}
$('#delivery').onchange=()=>{if($('#delivery').value!='live'){$('#mode').value='online';$('#city').value='o'}togDel()};
let orgs=[];
async function loadOrgs(){try{orgs=await api('/api/admin/organizers');$('#orgs').innerHTML=orgs.map(o=>`<option value="${esc(o.name)}">`).join('');orgInfo()}catch{}}
function orgInfo(){const n=$('#org').value.split('|')[0].trim().toLowerCase(),o=orgs.find(x=>x.name.toLowerCase()==n),p=$('#org_prev'),h=$('#org_hint');
 if(o&&o.hl){p.src='/api/logo/'+o.id+'?v='+o.updated;p.style.display='block';h.textContent='✓ لهذه الجهة شعار محفوظ، ارفع ملفًا جديدًا فقط إذا تبغى تغييره'}
 else{p.style.display='none';h.textContent=n?'ما فيه شعار محفوظ لهذه الجهة، ارفعه مرة واحدة وسيُحفظ':''}}
$('#org').oninput=orgInfo;
function toDataUrl(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const m=256,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/webp',0.85))};im.onerror=no;im.src=u})}

/* ---- التبويبات ---- */
function tab(v){['ev','sb','jb','ap','bk'].forEach(k=>$('#v_'+k).style.display=k==v?'':'none');document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.v)};
/* ---- الوظائف ---- */
let jobs=[],jid=null,apps=[];
const K={full:'دوام كامل',part:'دوام جزئي',intern:'تدريب',contract:'عقد'},ST={new:'جديد',good:'مرشّح',maybe:'احتياطي',no:'مرفوض'};
const jmsg=t=>{$('#jm').textContent=t;setTimeout(()=>$('#jm').textContent='',3500)};
const jstat=j=>{const t=new Date().toISOString().slice(0,10);return j.deadline&&j.deadline<t?['منتهية',0]:j.closed?['مغلقة',0]:['مفتوحة',1]};
function jdraw(){$('#jt').innerHTML=jobs.map(j=>{const [s,o]=jstat(j);return`<tr><td>${esc(j.title_ar)}${j.published?'':' <small>(مخفية)</small>'}<br><small class="mut">${K[j.kind]||''}${j.deadline?' · حتى '+esc(j.deadline):''}</small></td><td>${j.n}</td><td><span class="s ${o?'o':''}">${s}</span></td><td><button data-a="e" data-i="${j.id}">تعديل</button> <button data-a="c" data-i="${j.id}">${j.closed?'فتح التقديم':'قفل التقديم'}</button> <button data-a="p" data-i="${j.id}">${j.published?'إخفاء':'نشر'}</button> <button class="d" data-a="x" data-i="${j.id}">حذف</button></td></tr>`}).join('')||'<tr><td colspan=4>لا توجد وظائف بعد.</td></tr>';
 const cur=$('#ap_job').value;$('#ap_job').innerHTML='<option value="">كل الوظائف</option>'+[...new Set(apps.map(a=>a.job_title))].map(t=>`<option ${t==cur?'selected':''}>${esc(t)}</option>`).join('')}
async function jload(){try{jobs=await api('/api/admin/jobs');jdraw()}catch{jmsg('تعذر تحميل الوظائف')}}
const JF=['title_ar','title_en','org','kind','city','place','mode','exp','deadline','desc_ar','desc_en'];
function jfill(j){JF.forEach(k=>$('#j_'+k).value=j?j[k]||'':(k=='kind'?'full':k=='city'?'r':k=='mode'?'onsite':''));$('#j_q').value=j?j.questions.join('\n'):'';$('#j_closed').checked=!!(j&&j.closed);$('#j_published').checked=j?!!j.published:true;jid=j?j.id:null;$('#jft').textContent=j?'تعديل وظيفة':'إضافة وظيفة'}
$('#jsave').onclick=async()=>{const b={};JF.forEach(k=>b[k]=$('#j_'+k).value);b.questions=$('#j_q').value.split('\n').map(x=>x.trim()).filter(Boolean);b.closed=$('#j_closed').checked;b.published=$('#j_published').checked;
 if(!b.title_ar.trim())return jmsg('المسمى الوظيفي مطلوب');if(b.questions.length>10)return jmsg('الحد الأقصى 10 أسئلة');{const dm=datesMsg('','',b.deadline);if(dm)return jmsg(dm)}
 try{await api(jid?'/api/admin/jobs/'+jid:'/api/admin/jobs',J(jid?'PUT':'POST',b));jfill(null);jmsg('تم الحفظ ✓');jload()}catch{jmsg('فشل الحفظ')}};
$('#jcancel').onclick=()=>jfill(null);
$('#jt').onclick=async ev=>{const bt=ev.target.closest('button');if(!bt)return;const j=jobs.find(r=>r.id==bt.dataset.i),a=bt.dataset.a;
 try{if(a=='e'){jfill(j);tab('jb');scrollTo(0,0)}
 else if(a=='c'){await api('/api/admin/jobs/'+j.id,J('PUT',{...j,closed:!j.closed}));jload()}
 else if(a=='p'){await api('/api/admin/jobs/'+j.id,J('PUT',{...j,published:!j.published}));jload()}
 else if(a=='x'&&confirm('حذف هذه الوظيفة؟ طلبات التقديم والسير عليها تبقى محفوظة في بنك السير.')){await api('/api/admin/jobs/'+j.id,{method:'DELETE'});jload()}}catch{jmsg('فشلت العملية')}};
/* ---- الطلبات وبنك السير ---- */
const isPdf=a=>/\.pdf$/i.test(a.cv_name);
const ago=d=>esc(String(d||'').slice(0,10));
async function aload(){try{apps=await api('/api/admin/apps');const n=apps.filter(a=>a.status=='new').length;$('#nnew').textContent=n?'('+n+')':'';adraw();bdraw();jdraw()}catch{}}
const SC={new:'#7b8bd0',good:'#35c48a',maybe:'#f5a524',no:'#ff7b7b'};let apSt='',apA={},apQs=[],apQsJob=null;
function apFiltered(skipSt){const jb=$('#ap_job').value,q=$('#ap_q').value.toLowerCase().trim(),y1=$('#ap_y1').value,y2=$('#ap_y2').value;
 return apps.filter(a=>(!jb||a.job_title==jb)&&(skipSt||!apSt||a.status==apSt)&&(!q||(a.name+' '+a.email+' '+a.phone).toLowerCase().includes(q))&&(y1===''||a.years>=+y1)&&(y2===''||a.years<=+y2)&&Object.keys(apA).every(k=>!apA[k]||a.answers.some(x=>x.q==k&&x.a==apA[k])))}
function adraw(){const jb=$('#ap_job').value;
 if(apQsJob!==jb){apQsJob=jb;apA={};apQs=jb?[...new Set(apps.filter(a=>a.job_title==jb).flatMap(a=>a.answers.map(x=>x.q)))]:[];
  $('#ap_qs').innerHTML=apQs.map((q,i)=>`<div><label>${esc(String(q).split('|')[0].trim())}</label><select data-qi="${i}"><option value="">الكل</option><option value="y">نعم ✅</option><option value="n">لا ❌</option></select></div>`).join('')}
 const base=apFiltered(true);
 $('#ap_cnt').innerHTML=`<button class="cnt ${apSt?'':'on'}" data-st="">الكل ${base.length}</button>`+Object.keys(ST).map(k=>`<button class="cnt ${apSt==k?'on':''}" data-st="${k}" title="${ST[k]}"><i class="dot" style="background:${SC[k]}"></i> ${base.filter(a=>a.status==k).length}</button>`).join('');
 let r=apFiltered(false);if($('#ap_sort').value=='exp')r=[...r].sort((a,b)=>b.years-a.years);
 $('#ap_shown').textContent='المعروض: '+r.length;
 $('#apl').innerHTML=r.map(a=>`<div class="ap ${a.status}"><b>${esc(a.name)}</b><div class="mut" style="font-size:13px">${esc(a.job_title)} · خبرة ${a.years} سنة · ${ago(a.created_at)}<br><a href="mailto:${esc(a.email)}">${esc(a.email)}</a>${a.phone?' · <span dir="ltr">'+esc(a.phone)+'</span>':''}${/^https?:\/\//.test(a.linkedin)?' · <a href="'+esc(a.linkedin)+'" target="_blank" rel="noopener">لينكدإن</a>':''}</div>${a.answers.length?'<div style="font-size:13px;margin-top:6px">'+a.answers.map(x=>(x.a=='y'?'✅ ':'❌ ')+esc(String(x.q).split('|')[0].trim())).join('<br>')+'</div>':''}
 <div class="r sel">${isPdf(a)?`<a class="b" target="_blank" rel="noopener" href="/api/admin/cv/${a.id}?view=1">عرض السيرة</a>`:''}<a class="b p" href="/api/admin/cv/${a.id}">تحميل (${esc(a.cv_name.split('.').pop())})</a>${Object.keys(ST).map(k=>`<button class="dot ${a.status==k?'on':''}" style="background:${SC[k]};--c:${SC[k]}" title="${ST[k]}" data-s="${k}" data-i="${a.id}"></button>`).join('')}<input data-n="${a.id}" value="${esc(a.note)}" placeholder="ملاحظة" style="max-width:220px" maxlength="500"><button class="d" data-x="${a.id}">حذف</button></div></div>`).join('')||'<div class="mut">لا توجد طلبات.</div>'}
['ap_q','ap_y1','ap_y2'].forEach(i=>$('#'+i).oninput=adraw);$('#ap_sort').onchange=adraw;$('#ap_job').onchange=adraw;
$('#ap_cnt').onclick=e=>{const b=e.target.closest('button');if(b){apSt=b.dataset.st;adraw()}};
$('#ap_qs').onchange=e=>{const i=e.target.dataset.qi;if(i!=null){apA[apQs[i]]=e.target.value;adraw()}};
$('#apl').onclick=async ev=>{const b=ev.target.closest('button');if(!b)return;try{
 if(b.dataset.s){const a=apps.find(x=>x.id==b.dataset.i);await api('/api/admin/apps/'+a.id,J('PUT',{status:b.dataset.s,note:a.note}));a.status=b.dataset.s;aload()}
 else if(b.dataset.x&&confirm('حذف الطلب والسيرة نهائيًا؟')){await api('/api/admin/apps/'+b.dataset.x,{method:'DELETE'});aload()}}catch{msg('فشلت العملية')}};
$('#apl').onchange=async ev=>{const i=ev.target.dataset.n;if(!i)return;const a=apps.find(x=>x.id==i);try{await api('/api/admin/apps/'+i,J('PUT',{status:a.status,note:ev.target.value}));a.note=ev.target.value}catch{msg('فشل حفظ الملاحظة')}};
let bl=[];
function bdraw(){const q=$('#bk_q').value.toLowerCase(),st=$('#bk_st').value,y=+$('#bk_y').value||0,g={};
 bl=apps.filter(a=>(!st||a.status==st)&&a.years>=y&&(a.name+' '+a.email).toLowerCase().includes(q));bl.forEach(a=>(g[a.job_title]=g[a.job_title]||[]).push(a));
 $('#bkl').innerHTML=Object.keys(g).map(t=>`<h3 style="margin:16px 0 4px">${esc(t)} <small class="mut">(${g[t].length})</small></h3><table><tbody>${g[t].sort((a,b)=>b.years-a.years).map(a=>`<tr><td>${esc(a.name)}</td><td>${a.years} سنة</td><td><span class="st ${a.status}">${ST[a.status]}</span></td><td class="mut">${esc(a.email)}</td><td class="mut">${ago(a.created_at)}</td><td>${isPdf(a)?`<a class="b" target="_blank" rel="noopener" href="/api/admin/cv/${a.id}?view=1">عرض</a> `:''}<a class="b" href="/api/admin/cv/${a.id}">تحميل</a></td></tr>`).join('')}</tbody></table>`).join('')||'<div class="mut">لا توجد سير محفوظة.</div>'}
/* ---- تحميل السير كملف مضغوط ---- */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function mkzip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const f of files){const n=enc.encode(f.name),c=crc(f.data),L=f.data.length,h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,L,true);h.setUint32(22,L,true);h.setUint16(26,n.length,true);
  parts.push(h.buffer,n,f.data);
  const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x800,true);g.setUint16(14,0x21,true);g.setUint32(16,c,true);g.setUint32(20,L,true);g.setUint32(24,L,true);g.setUint16(28,n.length,true);g.setUint32(42,off,true);
  cen.push(g.buffer,n);off+=30+n.length+L}
 const cs=cen.reduce((s,b)=>s+b.byteLength,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
const safe=s=>String(s).replace(/[\\\/:*?"<>|\r\n]/g,'_').trim().slice(0,80)||'x';
async function zipApps(list,label,out){if(!list.length){out.textContent='لا يوجد مرشحون في هذا العرض';return}
 const files=[];try{for(let i=0;i<list.length;i++){const a=list[i];out.textContent=`جارٍ التحميل ${i+1} من ${list.length}…`;
  const r=await fetch('/api/admin/cv/'+a.id);if(!r.ok)throw 0;files.push({name:safe(a.job_title)+'/'+safe(a.name)+' ('+a.years+' سنة) - '+a.id+'.'+(a.cv_name.split('.').pop().replace(/[^a-z]/gi,'')||'pdf'),data:new Uint8Array(await r.arrayBuffer())})}
  const u=URL.createObjectURL(mkzip(files)),l=document.createElement('a');l.href=u;l.download=label+' '+new Date().toISOString().slice(0,10)+'.zip';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4);out.textContent='تم تنزيل '+files.length+' سيرة ✓'}
 catch{out.textContent='فشل التحميل'}}
$('#zip_ap').onclick=()=>{const jb=$('#ap_job').value;zipApps(apFiltered(true).filter(a=>a.status=='good'),'المرشحون'+(jb?' - '+safe(jb):''),$('#zip_m'))};
async function delApps(list,out){if(!list.length){out.textContent='لا يوجد شيء للحذف';return}
 if(!confirm('سيتم حذف '+list.length+' طلب مع سيرهم الذاتية نهائيًا ولا يمكن التراجع. هل حمّلت نسخة ZIP قبل الحذف؟ متابعة الحذف؟'))return;
 try{await api('/api/admin/apps/bulk',J('POST',{ids:list.map(a=>a.id)}));out.textContent='تم حذف '+list.length+' ✓';aload()}catch{out.textContent='فشل الحذف'}}
$('#del_ap').onclick=()=>delApps(apFiltered(false),$('#zip_m'));
$('#del_bk').onclick=()=>delApps(bl,$('#zip_m2'));
$('#zip_bk').onclick=()=>zipApps(bl,'بنك السير',$('#zip_m2'));
['bk_q','bk_st','bk_y'].forEach(i=>$('#'+i).oninput=bdraw);
fill(null);load();loadSubs();loadOrgs();jfill(null);aload().then(jload);
</script></body></html>
